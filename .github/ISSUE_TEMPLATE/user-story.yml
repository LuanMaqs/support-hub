name: User story
description: A unit of work with business value and acceptance criteria
labels: [story]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <capability>, so that <benefit>.
    validations: { required: true }
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Testable statements, one per line.
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
